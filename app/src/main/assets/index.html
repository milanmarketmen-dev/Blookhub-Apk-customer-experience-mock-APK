<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f8c"><link rel="manifest" href="manifest.json"><title>BLookHub Journey Preview</title>
<style>
:root{--teal:#087f8c;--teal2:#075e70;--blue:#073b64;--pink:#f41d72;--gold:#c59a54;--cream:#f6efe2;--ink:#17324b;--muted:#71808c;--line:#dfe5e8;--bg:#f5f7f8}*{box-sizing:border-box}body{margin:0;background:#111;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(430px,100vw);height:100dvh;margin:auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 35px #0008}.screen{height:100%;overflow:auto;padding-bottom:78px}.top{height:64px;background:white;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:5}.logo{font-weight:900;font-size:22px;letter-spacing:-1.5px;color:#087f8c}.logo b{color:#153e62}.avatar{width:36px;height:36px;border-radius:50%;background:#e9f3f4;display:grid;place-items:center;font-weight:800;color:var(--teal)}.pad{padding:16px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.h1{font-size:28px;line-height:1.08;margin:7px 0 8px;font-weight:850}.h2{font-size:20px;margin:0 0 12px;font-weight:850}.sub{color:var(--muted);font-size:14px;line-height:1.4}.input{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin:9px 0;font-size:14px;box-shadow:0 2px 7px #00000008}.btn{border:0;border-radius:13px;padding:14px 17px;font-weight:800;font-size:14px;width:100%;background:var(--teal);color:white;box-shadow:0 5px 12px #087f8c2a}.btn.pink{background:var(--pink)}.btn.outline{background:white;color:var(--teal);border:1px solid #b9d8dc;box-shadow:none}.btn.small{padding:10px 12px;width:auto}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 12px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700}.chip.active{background:#dff2f3;color:var(--teal);border-color:#b9dfe1}.hero{background:linear-gradient(135deg,#e7f6f5,#fff);border-radius:22px;padding:18px;margin:14px 16px;overflow:hidden}.hero .big{font-size:24px;font-weight:900}.servicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.service{background:#fff;border-radius:15px;padding:13px 8px;text-align:center;border:1px solid #edf0f2;font-weight:800;font-size:12px}.ico{width:38px;height:38px;border-radius:12px;margin:0 auto 8px;display:grid;place-items:center;background:#e6f4f4;color:var(--teal);font-size:18px}.card{background:white;border-radius:18px;margin:10px 0;padding:13px;border:1px solid #e9edef;box-shadow:0 3px 10px #00000009}.salon{display:flex;gap:12px}.thumb{width:76px;height:76px;border-radius:14px;background:linear-gradient(135deg,#d9c4aa,#6f8b82);flex:none;display:grid;place-items:center;color:white;font-weight:900;font-size:22px}.meta{font-size:12px;color:var(--muted)}.name{font-weight:850;margin-bottom:4px}.rating{color:#d89b20;font-weight:800}.heart{margin-left:auto;font-size:20px}.bottom{position:absolute;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #e6e9ea;display:flex;z-index:10}.nav{flex:1;text-align:center;padding-top:9px;font-size:10px;color:#75838b;font-weight:700}.nav.active{color:var(--teal)}.nav .ni{font-size:21px;display:block;margin-bottom:3px}.back{font-size:25px}.map{height:390px;margin:0 16px;border-radius:20px;background-color:#e4eee9;background-image:linear-gradient(25deg,transparent 48%,#c4d6cf 49%,#c4d6cf 51%,transparent 52%),linear-gradient(110deg,transparent 47%,#ccdcd8 48%,#ccdcd8 51%,transparent 52%),linear-gradient(10deg,transparent 65%,#fff 66%,#fff 67%,transparent 68%);position:relative;overflow:hidden}.pin{position:absolute;width:17px;height:17px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pink);box-shadow:0 2px 5px #0004}.pin:after{content:"";position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;top:6px;left:6px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#18384d;color:white;padding:11px 15px;border-radius:12px;font-size:12px;z-index:30;display:none}.progress{height:8px;background:#e8eded;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--teal);width:55%}.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;font-size:11px}.day.active{background:#ffe6ef;border-color:var(--pink);color:#b90c4e;font-weight:800}.timegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.time{background:white;border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center;font-size:12px}.time.active{background:#ffe3ec;border-color:var(--pink);color:#c00b4c;font-weight:800}.check{width:70px;height:70px;border-radius:50%;background:#dcf5e9;color:#1d9b61;display:grid;place-items:center;font-size:38px;margin:25px auto}.success{text-align:center}.section{padding:0 16px;margin-top:18px}.offer{background:linear-gradient(120deg,#f7d9bd,#f5efe8);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center}.tag{font-size:10px;background:#ffe5ef;color:#c10b4f;padding:4px 7px;border-radius:10px;font-weight:800}.listTabs{display:flex;gap:8px;margin:10px 0}.listTabs span{padding:8px 13px;border-radius:18px;background:#fff;font-size:12px;font-weight:800}.listTabs .on{background:#dff2f3;color:var(--teal)}
</style></head><body><div class="app" id="app"></div><div class="toast" id="toast"></div>
<script>
const app=document.getElementById('app'),toast=document.getElementById('toast');let state={screen:0,date:'Tue 16',time:'11:00 AM'};
const services=[['Healthcare','✚'],['Beauty & Wellness','✦'],['Fitness','◉'],['Events','◆'],['Dining','◒'],['Access','⌁']];
const salons=[['Looks Salon','4.8','2.1K','0.8 km'],['Toni&Guy','4.7','1.8K','1.2 km'],['Enrich Salon','4.6','1.7K','1.5 km']];
function nav(){return `<div class="bottom"><div class="nav active" onclick="go(3)"><span class="ni">⌂</span>Home</div><div class="nav" onclick="go(4)"><span class="ni">⌕</span>Discover</div><div class="nav" onclick="go(8)"><span class="ni">▣</span>Bookings</div><div class="nav"><span class="ni">◉</span>Activity</div><div class="nav"><span class="ni">☻</span>Profile</div></div>`}
function top(title='BLookHub',back=false){return `<div class="top">${back?`<span class="back" onclick="go(${Math.max(0,state.screen-1)})">‹</span>`:`<span class="logo">B<span style="color:#173b5d">L</span>ookHub</span>`}<b>${back?title:''}</b><span class="avatar">M</span></div>`}
function screen0(){return `<div class="screen"><div style="height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px;background:linear-gradient(160deg,#f2fbfb,#fff)"><div class="logo" style="font-size:36px">BLookHub</div><div class="eyebrow" style="margin-top:14px">One App. Many Services. A Smarter Everyday.</div><h1 class="h1" style="font-size:38px">Welcome to a simpler way to discover, book & experience.</h1><p class="sub">Healthcare · Beauty · Events · Fitness · Dining · Access</p><div style="margin-top:auto"><button class="btn" onclick="go(1)">Get Started</button><button class="btn outline" style="margin-top:10px" onclick="go(10)">Terms & Demo Notice</button><p class="sub" style="text-align:center;margin-top:12px">Interactive preview • Customer Journey</p></div></div></div>`}
function screen1(){return `<div class="screen">${top('Verify Mobile',true)}<div class="pad"><div class="eyebrow">1 / 2 · Mobile verification</div><h1 class="h1">Welcome!</h1><p class="sub">Let's get you started with your mobile number.</p><div class="input">+91 <b>98765 43210</b></div><button class="btn" onclick="toastMsg('OTP sent')">Send OTP</button><div style="text-align:center;margin:18px 0;color:#8a969c">or continue with</div><div class="row"><button class="btn outline">G Google</button><button class="btn outline"> Apple</button></div><div class="card" style="margin-top:24px;text-align:center"><b>Quick demo</b><div class="meta">Tap Continue to enter the customer journey.</div></div><button class="btn pink" style="margin-top:18px" onclick="go(2)">Continue</button></div></div>`}
function screen2(){return `<div class="screen">${top('Profile & Location',true)}<div class="pad"><div class="eyebrow">1 / 2 · Tell us about you</div><h1 class="h1">Let's get you started</h1><div class="input">Full Name<br><b>Milan Shah</b></div><div class="input">Email (Optional)<br><b>milan@gmail.com</b></div><div class="card">📍 <b>Use my current location</b><div class="meta">Andheri West, Mumbai</div></div><h2 class="h2">What are you interested in?</h2><div class="chips">${services.map((x,i)=>`<span class="chip ${i==0?'active':''}" onclick="this.classList.toggle('active')">${x[0]}</span>`).join('')}</div><button class="btn" style="margin-top:18px" onclick="go(3)">Continue</button></div></div>`}
function screen3(){return `<div class="screen">${top()}<div class="hero"><div class="eyebrow">Good evening, Milan</div><div class="big">Discover what’s near you.</div><div class="sub">Andheri West, Mumbai</div></div><div class="section"><div class="servicegrid">${services.slice(0,6).map(x=>`<div class="service" onclick="go(${x[0]=='Beauty & Wellness'?3:3})"><div class="ico">${x[1]}</div>${x[0]}</div>`).join('')}</div></div><div class="section"><h2 class="h2">Exclusive Offers Near You</h2><div class="offer"><div><b>Beauty & Lifestyle</b><div class="meta">Save up to 20% today</div></div><span class="tag">20% OFF</span></div></div><div class="section"><h2 class="h2">Explore Nearby</h2><div class="servicegrid"><div class="service" onclick="go(4)">💇<br>Salons</div><div class="service" onclick="go(4)">⚕️<br>Clinics</div><div class="service" onclick="go(4)">🎟️<br>Events</div></div></div>${nav()}</div>`}
function screen4(){return `<div class="screen">${top('Discover',true)}<div class="pad"><div class="input">⌕ Search doctors, salons, or area</div><div class="chips"><span class="chip active">All</span><span class="chip">Hair</span><span class="chip">Skin</span><span class="chip">Spa</span><span class="chip">Makeup</span></div><div class="listTabs"><span class="on">Open Now</span><span>Best Rated</span><span>Nearest</span><span>Offers</span></div>${salons.map((s,i)=>`<div class="card salon"><div class="thumb">${i==0?'LS':i==1?'TG':'ES'}</div><div style="flex:1"><div class="name">${s[0]} <span class="heart">♡</span></div><div class="meta">Andheri West · ${s[3]}</div><div class="rating">★ ${s[1]} <span class="meta">(${s[2]})</span></div><div class="meta" style="color:#21a366;margin:4px 0">Open · Offers</div><button class="btn small pink" onclick="go(6)">Book</button></div></div>`).join('')}<button class="btn outline" onclick="go(5)">Show Map</button></div>${nav()}</div>`}
function screen5(){return `<div class="screen">${top('Nearby',true)}<div class="map"><div class="pin" style="left:20%;top:27%"></div><div class="pin" style="left:62%;top:45%"></div><div class="pin" style="left:76%;top:28%"></div><div class="pin" style="left:42%;top:66%"></div><div class="pin" style="left:68%;top:73%"></div></div><div class="card" style="margin:12px 16px"><div class="salon"><div class="thumb">LS</div><div><div class="name">Looks Salon <span class="tag">20% OFF</span></div><div class="meta">Andheri West · 0.8 km</div><div class="rating">★ 4.8 · 2.1K reviews</div></div></div><div class="row" style="margin-top:12px"><button class="btn outline" onclick="toastMsg('Directions opened')">Directions</button><button class="btn pink" onclick="go(6)">Book Now</button></div></div></div>`}
function screen6(){return `<div class="screen">${top('Select Date & Time',true)}<div class="pad"><div class="card"><div class="name">Looks Salon</div><div class="meta">Andheri West, Mumbai</div><hr style="border:0;border-top:1px solid #eee"><b>Haircut & Styling</b><span style="float:right">₹800</span></div><h2 class="h2">Select Date</h2><div class="cal">${['Mon 15','Tue 16','Wed 17','Thu 18','Fri 19'].map((d,i)=>`<div class="day ${i==1?'active':''}" onclick="state.date='${d}';document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));this.classList.add('active')">${d.split(' ')[0]}<br><b>${d.split(' ')[1]}</b></div>`).join('')}</div><h2 class="h2" style="margin-top:22px">Morning</h2><div class="timegrid">${['10:00 AM','10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM'].map((t,i)=>`<div class="time ${i==2?'active':''}" onclick="state.time='${t}';document.querySelectorAll('.time').forEach(x=>x.classList.remove('active'));this.classList.add('active')">${t}</div>`).join('')}</div><h2 class="h2" style="margin-top:22px">Evening</h2><div class="timegrid">${['4:00 PM','4:30 PM','5:00 PM','5:30 PM','6:00 PM','6:30 PM'].map(t=>`<div class="time" onclick="state.time='${t}';document.querySelectorAll('.time').forEach(x=>x.classList.remove('active'));this.classList.add('active')">${t}</div>`).join('')}</div><button class="btn pink" style="margin-top:20px" onclick="go(7)">Confirm Booking</button></div></div>`}
function screen7(){return `<div class="screen">${top('Booking Confirmed',true)}<div class="pad success"><div class="check">✓</div><div class="eyebrow">Booking ID: QS78236</div><h1 class="h1">You're all set!</h1><p class="sub">Your appointment at Looks Salon is confirmed.</p><div class="card" style="text-align:left"><b>Haircut & Styling</b><span style="float:right">₹800</span><div class="meta" style="margin-top:8px">${state.date} · ${state.time}</div><div class="meta">Andheri West, Mumbai</div></div><button class="btn" onclick="toastMsg('Added to calendar')">＋ Add to Calendar</button><button class="btn outline" style="margin-top:10px" onclick="go(8)">Manage Booking</button></div></div>`}
function screen8(){return `<div class="screen">${top('My Bookings',true)}<div class="pad"><div class="listTabs"><span class="on">Upcoming</span><span>Past</span></div><div class="card salon"><div class="thumb">LS</div><div style="flex:1"><div class="name">Looks Salon <span class="tag">Confirmed</span></div><div class="meta">Haircut & Styling</div><div class="meta">${state.date}, ${state.time}</div><div class="row" style="margin-top:9px"><button class="btn small outline" onclick="toastMsg('Reschedule selected')">Reschedule</button><button class="btn small" onclick="toastMsg('Booking details opened')">View</button></div></div></div><div class="card salon"><div class="thumb">TG</div><div style="flex:1"><div class="name">Toni&Guy</div><div class="meta">Upcoming · Sep 16</div><button class="btn small outline" style="margin-top:8px" onclick="go(4)">View</button></div></div><h2 class="h2" style="margin-top:24px">Explore More on BLookHub</h2><div class="servicegrid"><div class="service" onclick="go(9)">⚕️<br>QueCare</div><div class="service" onclick="go(9)">🎟️<br>QueEvent</div><div class="service" onclick="go(9)">🏋️<br>QueFit</div></div><button class="btn pink" style="margin-top:14px" onclick="go(9)">Explore More on BLookHub</button></div>${nav()}</div>`}
function screen9(){return `<div class="screen">${top('Explore More',true)}<div class="pad"><div class="hero"><div class="eyebrow">Also on BLookHub</div><div class="big">One app. Many ways to experience more.</div><div class="sub">Continue exploring trusted services after your appointment.</div></div><div class="servicegrid"><div class="service" onclick="toastMsg('QueCare opened')"><div class="ico">⚕️</div>QueCare<br><span class="meta">Find doctors & book</span></div><div class="service"><div class="ico">🎟️</div>QueEvent<br><span class="meta">Manage your events</span></div><div class="service"><div class="ico">🏋️</div>QueFit<br><span class="meta">Fitness coming soon</span></div><div class="service"><div class="ico">🍽️</div>QueDine<br><span class="meta">Dining coming soon</span></div></div><button class="btn" style="margin-top:20px" onclick="go(3)">Back to BLookHub Home</button></div>${nav()}</div>`}
function screen10(){return `<div class="screen">${top('Terms & Demo Notice',true)}<div class="pad"><div class="eyebrow">Preview version</div><h1 class="h1">Before you continue</h1><div class="card"><b>1. This is a mock app</b><div class="meta" style="margin-top:6px">The screens demonstrate the intended customer journey and visual experience. They are not connected to live services.</div></div><div class="card"><b>2. Demo information only</b><div class="meta" style="margin-top:6px">Names, locations, prices, booking IDs and availability shown in this preview are sample data.</div></div><div class="card"><b>3. No real transactions</b><div class="meta" style="margin-top:6px">The mock does not process payments, create real appointments, send OTPs, or contact businesses.</div></div><div class="card"><b>4. Product preview</b><div class="meta" style="margin-top:6px">The purpose is to review the customer flow, screen hierarchy and interaction feel before production development.</div></div><button class="btn" onclick="go(1)">Accept & Continue</button><button class="btn outline" style="margin-top:10px" onclick="go(0)">Back</button></div></div>`}
const screens=[screen0,screen1,screen2,screen3,screen4,screen5,screen6,screen7,screen8,screen9,screen10];
function go(n){state.screen=n;app.innerHTML=screens[n]()} function toastMsg(m){toast.textContent=m;toast.style.display='block';setTimeout(()=>toast.style.display='none',1400)}go(0);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
